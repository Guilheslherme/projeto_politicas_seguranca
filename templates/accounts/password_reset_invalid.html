{% extends "base.html" %}
{% block title %}Link inválido | Health In Sight{% endblock %}

{% block content %}
<div class="card card-narrow">
  <h1>Link não utilizável</h1>

  <div class="alert error">{{ mensagem }}</div>

  <p class="muted">
    Sua senha atual continua valendo. Peça um link novo para recomeçar.
  </p>

  <a class="btn-primary block" href="{% url 'accounts:password_reset' %}">Pedir um link novo</a>

  <p class="small">
    <a href="{% url 'accounts:login' %}">Voltar para a entrada</a>
  </p>
</div>
{% endblock %}
